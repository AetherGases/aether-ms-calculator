# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Continuous Integration

on:
  push:
    branches: [ "main", "staging", "develop" ]
  pull_request:
    branches: [ "main", "staging", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      mongo:
        image: mongo:8.0.13
        env:
          MONGO_INITDB_ROOT_USERNAME: ${{ secrets.MONGO_USER }}
          MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a ci_redis_password ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        command: redis-server --requirepass ci_redis_password --appendonly yes

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Create postgres database schema
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          psql \
            -h localhost \
            -p 5432 \
            -U "${{ secrets.POSTGRES_USER }}" \
            -d "${{ secrets.POSTGRES_DB }}" \
            -f src/main/resources/postgresdb/schema.sql    

      - name: Test with Maven
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MONGO_USER: ${{ secrets.MONGO_USER }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ci_redis_password
          SPRING_PROFILES_ACTIVE: test
        run: |
          if [ -n "$MONGO_USER" ]; then
            ENC_USER=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote_plus(os.environ["MONGO_USER"]))')
            ENC_PASS=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote_plus(os.environ.get("MONGO_PASSWORD", "")))')
            export MONGO_URL="mongodb://${ENC_USER}:${ENC_PASS}@localhost:27017/admin?authSource=admin"
          else
            export MONGO_URL="mongodb://localhost:27017/admin"
          fi
          mvn clean compile test -DskipTests=false

      - name: Show Surefire reports
        if: failure()
        run: |
          if [ -d target/surefire-reports ]; then
            for f in target/surefire-reports/*.txt; do
              echo "===== $f ====="
              cat "$f"
            done
          else
            echo "No surefire reports found"
          fi